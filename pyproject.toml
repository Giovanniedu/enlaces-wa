[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "enlaces-wa"
version = "0.1.0"
description = "Generador open source de enlaces de WhatsApp para emprendedores hispanohablantes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
[project.scripts]
enlaces-wa = "enlaces_wa.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
